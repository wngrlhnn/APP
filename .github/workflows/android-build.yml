name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: android-build-\${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Download Jeep photos from Wikimedia Commons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          sudo apt-get update
          sudo apt-get install -y imagemagick

          download_and_prepare() {
            local output="$1"
            local url="$2"
            curl -fL --retry 3 --retry-delay 2 -A "Mozilla/5.0" "$url" -o "/tmp/source.jpg"
            magick "/tmp/source.jpg" -auto-orient -resize "1200x900^" -gravity center -crop "1200x900+0+0" +repage -strip -interlace Plane -quality 82 "app/src/main/res/drawable-nodpi/$output"
          }

          download_and_prepare jeep_tj.jpg "https://upload.wikimedia.org/wikipedia/commons/d/d9/Jeep_TJ_Wrangler.jpg"
          download_and_prepare jeep_yj.jpg "https://upload.wikimedia.org/wikipedia/commons/3/31/Jeep-Wrangler-YJ.jpg"
          download_and_prepare jeep_sahara.jpg "https://upload.wikimedia.org/wikipedia/commons/2/2f/%2707_Jeep_Wrangler_Sahara_2-Door.jpg"
          download_and_prepare jeep_sahara_open.jpg "https://upload.wikimedia.org/wikipedia/commons/1/15/%2707_Jeep_Wrangler_Sahara_Convertible_2-Door.jpg"
          download_and_prepare jeep_cherokee_2door.jpg "https://upload.wikimedia.org/wikipedia/commons/0/08/Jeep_Cherokee_2-door.jpg"
          download_and_prepare jeep_cherokee_xj.jpg "https://upload.wikimedia.org/wikipedia/commons/6/60/97-01_Jeep_Cherokee.jpg"
          download_and_prepare jeep_cherokee_kk.jpg "https://upload.wikimedia.org/wikipedia/commons/4/4c/Jeep_Cherokee_184151.jpg"
          download_and_prepare jeep_grand_cherokee_zj.jpg "https://upload.wikimedia.org/wikipedia/commons/7/78/Jeep_Grand_Cherokee_ZJ.jpg"
          download_and_prepare jeep_grand_cherokee_wj.jpg "https://upload.wikimedia.org/wikipedia/commons/6/65/Jeep-Grand-Cherokee-WJ.jpg"
          download_and_prepare jeep_grand_cherokee_wk.jpg "https://upload.wikimedia.org/wikipedia/commons/7/74/Jeep-Grand-Cherokee-WK.jpg"
          download_and_prepare jeep_grand_cherokee_4xe.jpg "https://upload.wikimedia.org/wikipedia/commons/2/26/Jeep_Grand_Cherokee_4xe_001.jpg"
          download_and_prepare jeep_compass.jpg "https://upload.wikimedia.org/wikipedia/commons/e/e2/Jeep_Compass.jpg"
          download_and_prepare jeep_compass_white.jpg "https://upload.wikimedia.org/wikipedia/commons/b/b3/Jeep-Compass.jpg"
          download_and_prepare jeep_liberty.jpg "https://upload.wikimedia.org/wikipedia/commons/6/6b/Jeep_Liberty.jpg"
          download_and_prepare jeep_patriot.jpg "https://upload.wikimedia.org/wikipedia/commons/7/7a/Jeep_Patriot.jpg"
          download_and_prepare jeep_renegade.jpg "https://upload.wikimedia.org/wikipedia/commons/f/f6/Jeep_Renegade_174247.jpg"
          download_and_prepare jeep_cj.jpg "https://upload.wikimedia.org/wikipedia/commons/0/0d/Jeep-CJ.jpg"
          download_and_prepare jeep_gladiator_willys.jpg "https://upload.wikimedia.org/wikipedia/commons/0/0f/26_Jeep_Gladiator_Willys.jpg"
          download_and_prepare jeep_gladiator_sahara.jpg "https://upload.wikimedia.org/wikipedia/commons/8/80/26_Jeep_Gladiator_Sahara.jpg"

          magick app/src/main/res/drawable-nodpi/jeep_tj.jpg -gravity center -crop 1:1 +repage -resize 512x512 -strip -quality 88 app/src/main/res/drawable-nodpi/jeep_photo_icon.jpg

      - name: Assemble debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JeepExplorer-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create latest app/build/outputs/apk/debug/app-debug.apk \
              --title "Jeep Explorer Latest" \
              --notes "Latest installable Jeep Explorer Android APK."
          fi

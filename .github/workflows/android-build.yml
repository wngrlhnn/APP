name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Download 200 real animated GIFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi

          git clone --depth 1 --filter=blob:none --no-checkout \
            https://github.com/open-assets-hub/animated-country-flags.git /tmp/animated-flags
          cd /tmp/animated-flags
          git sparse-checkout init --cone
          git sparse-checkout set packs/waving packs/circle-wave
          git checkout --quiet

          mapfile -t codes < <(find packs/waving -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | head -100)
          test "${#codes[@]}" -eq 100

          n=1
          for code in "${codes[@]}"; do
            cp "packs/waving/${code}/${code}-128.gif" "${GITHUB_WORKSPACE}/app/src/main/res/drawable-nodpi/$(printf 'gif%03d.gif' "$n")"
            cp "packs/circle-wave/${code}/${code}-128.gif" "${GITHUB_WORKSPACE}/app/src/main/res/drawable-nodpi/$(printf 'gif%03d.gif' "$((n+100))")"
            n=$((n+1))
          done

          count=$(find "${GITHUB_WORKSPACE}/app/src/main/res/drawable-nodpi" -name '*.gif' | wc -l)
          echo "Downloaded $count animated GIFs"
          test "$count" -eq 200

      - name: Assemble debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GifGallery-200-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create latest app/build/outputs/apk/debug/app-debug.apk --title "GIF Gallery 200+" --notes "200 real animated GIFs bundled offline. GIF assets are from the MIT-licensed Animated Country Flags project."
          fi

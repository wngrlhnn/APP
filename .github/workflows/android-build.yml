name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Generate offline GIF collection
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-pil
          mkdir -p app/src/main/res/drawable-nodpi
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import math, os
          out="app/src/main/res/drawable-nodpi"
          os.makedirs(out, exist_ok=True)
          W=H=96

          def make(name, draw):
              frames=[]
              for f in range(8):
                  im=Image.new("RGB",(W,H),(8,8,12))
                  draw(ImageDraw.Draw(im),f)
                  frames.append(im)
              frames[0].save(os.path.join(out,name),save_all=True,append_images=frames[1:],duration=100,loop=0,optimize=True)

          def neon(d,f):
              for r in range(10,45,8):
                  d.ellipse((48-r,48-r,48+r,48+r),outline=((r*5+f*20)%255,80,220),width=2)

          def ball(d,f):
              x=10+76*f/7; y=65-35*math.sin(math.pi*f/7)
              d.ellipse((x-7,y-7,x+7,y+7),fill=(80,220,255))

          def stars(d,f):
              for i in range(12):
                  x=(i*23+f*6)%96; y=(i*37+f*3)%96
                  d.ellipse((x,y,x+2,y+2),fill=(255,255,255))

          def fire(d,f):
              for i in range(20):
                  x=48+(i%5-2)*8; y=82-(i*7+f*9)%65
                  d.rectangle((x,y,x+4,y+4),fill=(255,(i*20+80)%220,20))

          def waves(d,f):
              for y0 in (25,48,71):
                  pts=[(x,y0+6*math.sin(x*.12+f*.7)) for x in range(96)]
                  d.line(pts,fill=(50,170,255),width=2)

          def sun(d,f):
              for i in range(8):
                  a=i*math.pi/4+f*.2
                  d.line((48+20*math.cos(a),48+20*math.sin(a),48+38*math.cos(a),48+38*math.sin(a)),fill=(255,180,40),width=3)
              d.ellipse((30,30,66,66),fill=(255,130,30))

          def glitch(d,f):
              for i in range(10):
                  x=(i*17+f*13)%96; y=(i*9+f*7)%96
                  d.rectangle((x,y,min(95,x+12),y+3),fill=((i*50+f*30)%255,200,80))

          def orbit(d,f):
              a=f*math.pi/4
              d.ellipse((20,20,76,76),outline=(120,80,255),width=2)
              x=42+24*math.cos(a); y=42+24*math.sin(a)
              d.ellipse((x-4,y-4,x+4,y+4),fill=(80,240,180))

          for name,fn in [
              ("neon.gif",neon),("ball.gif",ball),("stars.gif",stars),("fire.gif",fire),
              ("waves.gif",waves),("sun.gif",sun),("glitch.gif",glitch),("orbit.gif",orbit)
          ]: make(name,fn)
          PY

      - name: Assemble debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GifGallery-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create latest app/build/outputs/apk/debug/app-debug.apk               --title "GIF Gallery Latest"               --notes "Latest offline animated GIF gallery Android APK."
          fi

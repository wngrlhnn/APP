name: Android Build
# 5000 GIF gallery build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Cache GIF gallery assets
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/res/drawable-nodpi
            app/src/main/assets/manifest.json
          key: gif-gallery-${{ hashFiles('scripts/download_gifs.py') }}-v1
          restore-keys: |
            gif-gallery-${{ hashFiles('scripts/download_gifs.py') }}-
            gif-gallery-

      - name: Bootstrap GIF gallery from existing latest APK
        shell: bash
        run: |
          set -euo pipefail
          count=$(find app/src/main/res/drawable-nodpi -maxdepth 1 -name 'gif*.gif' | wc -l)
          if [ "$count" -lt 5000 ]; then
            echo "GIF cache is empty; restoring the existing gallery from the latest release APK."
            mkdir -p /tmp/gif-bootstrap
            curl -L --fail --silent --show-error "https://github.com/wngrlhnn/APP/releases/download/latest/app-debug.apk" -o /tmp/gif-bootstrap/app.apk
            unzip -q /tmp/gif-bootstrap/app.apk 'res/drawable-nodpi/gif*.gif' -d /tmp/gif-bootstrap/extracted
            mkdir -p app/src/main/res/drawable-nodpi
            cp /tmp/gif-bootstrap/extracted/res/drawable-nodpi/gif*.gif app/src/main/res/drawable-nodpi/
            echo '[{"restored_from":"latest-release"}]' > app/src/main/assets/manifest.json
          fi

      - name: Download and aggressively compress 5,000 real animated GIFs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow requests
          python3 scripts/download_gifs.py

      - name: Assemble debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GifGallery-5000-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create latest app/build/outputs/apk/debug/app-debug.apk --title "GIF Gallery 5000+" --notes "5,000 animated GIFs. No country flags. Includes reactions, effects and original animations."
          fi

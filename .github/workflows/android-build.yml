name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: android-build-\${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Download and bundle Jeep photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          sudo apt-get update
          sudo apt-get install -y imagemagick jq

          download_jeep() {
            local output="$1"
            local search="$2"
            local api url
            api="$(curl -fsSL --retry 4 --retry-delay 2 -A "JeepExplorer/1.0" -G "https://commons.wikimedia.org/w/api.php" --data-urlencode "action=query" --data-urlencode "generator=search" --data-urlencode "gsrsearch=$search" --data-urlencode "gsrnamespace=6" --data-urlencode "gsrlimit=8" --data-urlencode "prop=imageinfo" --data-urlencode "iiprop=url" --data-urlencode "iiurlwidth=1200" --data-urlencode "format=json")"
            url="$(printf '%s' "$api" | jq -r '.query.pages[]?.imageinfo[0].thumburl // empty' | head -n 1)"
            if [ -z "$url" ]; then echo "No Wikimedia result for: $search"; return 1; fi
            curl -fL --retry 4 --retry-delay 2 -A "JeepExplorer/1.0" "$url" -o /tmp/source
            magick /tmp/source -auto-orient -resize "1200x900^" -gravity center -crop "1200x900+0+0" +repage -strip -interlace Plane -quality 82 "app/src/main/res/drawable-nodpi/$output"
          }

          download_jeep jeep_tj.jpg "Jeep Wrangler TJ"
          download_jeep jeep_yj.jpg "Jeep Wrangler YJ"
          download_jeep jeep_sahara.jpg "Jeep Wrangler Sahara"
          download_jeep jeep_sahara_open.jpg "Jeep Wrangler open"
          download_jeep jeep_cherokee_2door.jpg "Jeep Cherokee 2 door"
          download_jeep jeep_cherokee_xj.jpg "Jeep Cherokee XJ"
          download_jeep jeep_cherokee_kk.jpg "Jeep Cherokee KK"
          download_jeep jeep_grand_cherokee_zj.jpg "Jeep Grand Cherokee ZJ"
          download_jeep jeep_grand_cherokee_wj.jpg "Jeep Grand Cherokee WJ"
          download_jeep jeep_grand_cherokee_wk.jpg "Jeep Grand Cherokee WK"
          download_jeep jeep_grand_cherokee_4xe.jpg "Jeep Grand Cherokee 4xe"
          download_jeep jeep_compass.jpg "Jeep Compass"
          download_jeep jeep_compass_white.jpg "Jeep Compass white"
          download_jeep jeep_liberty.jpg "Jeep Liberty"
          download_jeep jeep_patriot.jpg "Jeep Patriot"
          download_jeep jeep_renegade.jpg "Jeep Renegade"
          download_jeep jeep_cj.jpg "Jeep CJ"
          download_jeep jeep_gladiator_willys.jpg "Jeep Gladiator Willys"
          download_jeep jeep_gladiator_sahara.jpg "Jeep Gladiator Sahara"

          magick app/src/main/res/drawable-nodpi/jeep_tj.jpg -gravity center -crop 1:1 +repage -resize 512x512 -strip -quality 88 app/src/main/res/drawable-nodpi/jeep_photo_icon.jpg

      - name: Assemble debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JeepExplorer-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create latest app/build/outputs/apk/debug/app-debug.apk \
              --title "Jeep Explorer Latest" \
              --notes "Latest installable Jeep Explorer Android APK."
          fi

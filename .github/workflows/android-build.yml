name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Download 100 real animated GIFs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick jq
          mkdir -p app/src/main/res/drawable-nodpi
          terms=("animated smiley" "animated animals" "animated nature" "animated space" "animated art" "animated science" "animated flags" "animated letters" "animated numbers" "animated flowers" "animated earth" "animated ocean" "animated weather" "animated cartoon" "animated icons" "animated chess" "animated maps" "animated mars" "animated sky" "animated throbber")
          n=0
          for term in "${terms[@]}"; do
            [ "$n" -ge 100 ] && break
            json="$(curl -fsSL --retry 4 --retry-delay 2 -A 'GIFGallery/1.0' -G 'https://commons.wikimedia.org/w/api.php' --data-urlencode 'action=query' --data-urlencode 'generator=search' --data-urlencode "gsrsearch=$term filetype:gif" --data-urlencode 'gsrnamespace=6' --data-urlencode 'gsrlimit=20' --data-urlencode 'prop=imageinfo' --data-urlencode 'iiprop=url' --data-urlencode 'iiurlwidth=360' --data-urlencode 'format=json')"
            while read -r url; do
              [ "$n" -ge 100 ] && break
              [ -z "$url" ] && continue
              n=$((n+1))
              name=$(printf 'gif%03d.gif' "$n")
              if curl -fL --max-time 45 --retry 2 -A 'GIFGallery/1.0' "$url" -o "/tmp/$name"; then
                if convert "/tmp/$name" -coalesce -resize '360x360>' -layers Optimize -loop 0 "app/src/main/res/drawable-nodpi/$name" 2>/dev/null; then
                  echo "Added $name from $term"
                else
                  rm -f "app/src/main/res/drawable-nodpi/$name"
                  n=$((n-1))
                fi
              else
                n=$((n-1))
              fi
            done < <(printf '%s' "$json" | jq -r '.query.pages[]?.imageinfo[0].thumburl // empty' | sort -u)
          done
          echo "Downloaded $n GIFs"
          if [ "$n" -lt 100 ]; then echo 'Not enough GIFs downloaded' >&2; exit 1; fi

      - name: Assemble debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GifGallery-100-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create latest app/build/outputs/apk/debug/app-debug.apk --title "GIF Gallery 100+" --notes "100 real animated GIFs bundled offline."
          fi

name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Download 200 real animated GIFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi

          codes=(ad ae af ag ai al am ao ar at au az ba bb bd be bf bg bh bi bj bn bo br bs bt bw by bz ca cd cf cg ch ci cl cm cn co cr cu cv cy cz de dj dk dm do dz ec ee eg er es et fi fj fm fo fr ga gb gd ge gh gl gm gn gq gr gt gw gy hk hn hr ht hu id ie il in iq ir is it jm jo jp ke kg kh ki km kn kp kr kw kz la lb lc li lk lr ls lt lu lv ly ma mc md me mg mh mk ml mm mn mo mr mt mu mv mw mx my mz na ne ng ni nl no np nr nz om pa pe pg ph pk pl ps pt pw py qa ro rs ru rw sa sb sc sd se sg si sk sl sm sn so sr ss st sv sy sz td tg th tj tl tm tn to tr tt tv tw tz ua ug us uy uz va vc ve vn vu ws ye za zm zw)

          download_one() {
            local n="$1"
            local code="$2"
            local wave circle
            wave=$(printf 'gif%03d.gif' "$n")
            circle=$(printf 'gif%03d.gif' "$((n+100))")

            curl -fL --retry 3 --retry-delay 1 --connect-timeout 10 --max-time 30 \
              "https://raw.githubusercontent.com/open-assets-hub/animated-country-flags/main/packs/waving/${code}/${code}-128.gif" \
              -o "app/src/main/res/drawable-nodpi/${wave}"

            curl -fL --retry 3 --retry-delay 1 --connect-timeout 10 --max-time 30 \
              "https://raw.githubusercontent.com/open-assets-hub/animated-country-flags/main/packs/circle-wave/${code}/${code}-128.gif" \
              -o "app/src/main/res/drawable-nodpi/${circle}"

            test -s "app/src/main/res/drawable-nodpi/${wave}"
            test -s "app/src/main/res/drawable-nodpi/${circle}"
          }
          export -f download_one

          printf '%s\n' "${codes[@]}" | nl -v1 -w1 | awk '{print $1, $2}' |
            xargs -n2 -P8 bash -c 'download_one "$1" "$2"' _

          count=$(find app/src/main/res/drawable-nodpi -name '*.gif' | wc -l)
          echo "Downloaded $count animated GIFs"
          test "$count" -eq 200

      - name: Assemble debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GifGallery-200-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create latest app/build/outputs/apk/debug/app-debug.apk --title "GIF Gallery 200+" --notes "200 real animated GIFs bundled offline. GIF assets are from the MIT-licensed Animated Country Flags project."
          fi
